services:
  mongodb:
    image: mongo:7.0
    container_name: chat_db
    restart: always
    ports:
      - "27019:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=ChatProject

  # 2. Node.js container 
  backend:
    build:
      context: ChatBackend
      dockerfile: Dockerfile
    container_name: chat_backend
    restart: always
    ports:
      - "3002:3000"
    env_file:
      - ./ChatBackend/.env
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/ChatProject
    depends_on:
      - mongodb

  # React frontend container 
  frontend:
    build:
      context: Chat-Frontend
      dockerfile: Dockerfile
    container_name: chat_frontend
    restart: always
    ports:
      - "82:80"
    depends_on:
      - backend

# persistent volumes for mongodb data 
volumes:
  mongo-data: